name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test --configuration Release --no-build --logger trx --results-directory artifacts/tests
      - name: Restore EF Core tool
        run: dotnet tool restore
      - name: Apply migrations and check model snapshot
        env:
          ConnectionStrings__DefaultConnection: Data Source=ci-migrations.db
        run: |
          dotnet ef database update --project src/StudyFlow.Api --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes --project src/StudyFlow.Api --configuration Release --no-build
      - name: HTTP integration tests with SQLite
        run: python scripts/smoke_test.py
      - name: Upload test results and API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-test-results
          path: artifacts/
